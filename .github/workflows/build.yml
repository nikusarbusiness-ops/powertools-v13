
name: PowerTools Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PowerTools
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show Project Structure
        run: |
          echo "===== PROJECT FILES ====="
          pwd
          ls -la
          echo "===== SOURCE FILES ====="
          find src -type f 2>/dev/null || true
          echo "===== LIBRARY FILES ====="
          find lib -type f 2>/dev/null || true

      - name: Build Plugin with Maven
        run: mvn --batch-mode --errors clean package

      - name: Prepare Release
        run: |
          mkdir -p release
          find target -maxdepth 1 -name '*.jar' \
            ! -name 'original-*.jar' \
            -exec cp {} release/ \;

      - name: Package Resource Pack
        run: |
          if [ -f resourcepack/pack.mcmeta ]; then
            cd resourcepack
            zip -r ../release/PowerTools-ResourcePack.zip .
          else
            echo "No resource pack folder found. Skipping."
          fi

      - name: Upload Finished Files
        uses: actions/upload-artifact@v4
        with:
          name: PowerTools-Build
          path: release/
          if-no-files-found: error
          retention-days: 30
