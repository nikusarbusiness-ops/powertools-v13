
name: PowerTools Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile PowerTools
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check Project Files
        run: |
          echo "Checking project..."
          test -f pom.xml
          test -f src/main/java/de/powersmp/powertools/PowerTools.java
          test -f src/main/resources/plugin.yml
          test -f lib/PowerEco.jar

      - name: Build Plugin
        run: mvn --batch-mode clean package

      - name: Prepare Release Files
        run: |
          mkdir -p release
          cp target/*.jar release/

      - name: Package Resource Pack
        if: hashFiles('resourcepack/pack.mcmeta') != ''
        run: |
          cd resourcepack
          zip -r ../release/PowerTools-ResourcePack.zip .

      - name: Upload Finished Files
        uses: actions/upload-artifact@v4
        with:
          name: PowerTools-1.3.1-Files
          path: release/
          if-no-files-found: error
          retention-days: 30
