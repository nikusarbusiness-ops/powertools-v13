
name: Build PowerTools

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Compile PowerTools
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Plugin
        run: mvn --batch-mode clean package

      - name: Prepare Resource Pack
        run: |
          mkdir -p dist
          if [ -d resourcepack ]; then
            cd resourcepack
            zip -r ../dist/PowerTools-ResourcePack.zip .
          fi

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: PowerTools-1.3.1
          path: target/PowerTools-1.3.1.jar

      - name: Upload Resource Pack
        if: hashFiles('resourcepack/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: PowerTools-ResourcePack
          path: dist/PowerTools-ResourcePack.zip
